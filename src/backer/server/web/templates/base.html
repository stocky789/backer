<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Backer{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <span class="logo-icon">◉</span>
            Backer
        </div>
        <nav>
            <a href="/" class="nav-item {% if active == 'dashboard' %}active{% endif %}">
                <span class="nav-icon">▣</span> Dashboard
            </a>
            <a href="/agents" class="nav-item {% if active == 'agents' %}active{% endif %}">
                <span class="nav-icon">◫</span> Agents
            </a>
            <a href="/jobs" class="nav-item {% if active == 'jobs' %}active{% endif %}">
                <span class="nav-icon">▤</span> Jobs
            </a>
            <a href="/history" class="nav-item {% if active == 'history' %}active{% endif %}">
                <span class="nav-icon">◷</span> History
            </a>
            <a href="/settings" class="nav-item {% if active == 'settings' %}active{% endif %}">
                <span class="nav-icon">⚙</span> Settings
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="server-status">
                <span class="status-dot online"></span>
                Server Online
            </div>
        </div>
    </div>

    <main class="main-content">
        <header class="top-bar">
            <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
            <div class="top-bar-actions">
                {% block actions %}{% endblock %}
            </div>
        </header>

        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
