<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Backer{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="/static/logo.svg" alt="Backer" class="logo-icon">
            Backer
        </div>
        <nav>
            <a href="/" class="nav-item {% if active == 'dashboard' %}active{% endif %}">
                <span class="nav-icon">▣</span> Dashboard
            </a>
            <a href="/agents" class="nav-item {% if active == 'agents' %}active{% endif %}">
                <span class="nav-icon">◫</span> Agents
            </a>
            <a href="/storage" class="nav-item {% if active == 'storage' %}active{% endif %}">
                <span class="nav-icon">▦</span> Storage
            </a>
            <a href="/jobs" class="nav-item {% if active == 'jobs' %}active{% endif %}">
                <span class="nav-icon">▤</span> Backups
            </a>
            <a href="/history" class="nav-item {% if active == 'history' %}active{% endif %}">
                <span class="nav-icon">◷</span> History
            </a>
            <a href="/restore" class="nav-item {% if active == 'restore' %}active{% endif %}">
                <span class="nav-icon">↩</span> Restore
            </a>
            <a href="/settings" class="nav-item {% if active == 'settings' %}active{% endif %}">
                <span class="nav-icon">⚙</span> Settings
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="server-status">
                <span class="status-dot online"></span>
                Server Online
            </div>
        </div>
    </div>

    <main class="main-content">
        <header class="top-bar">
            <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
            <div class="top-bar-center">
                <!-- Background Tasks Widget - Always visible -->
                <div id="tasksWidget" class="tasks-widget">
                    <div class="tasks-indicator" onclick="toggleTasksPanel()">
                        <span class="tasks-spinner"></span>
                        <span id="tasksLabel">No background tasks</span>
                    </div>
                    <div id="tasksPanel" class="tasks-panel">
                        <div class="tasks-panel-header">
                            <strong>Background Tasks</strong>
                            <button class="tasks-close" onclick="toggleTasksPanel()">&times;</button>
                        </div>
                        <div id="tasksList" class="tasks-list">
                            <!-- Tasks will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="top-bar-actions">
                {% block actions %}{% endblock %}
            </div>
        </header>

        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Background Tasks JavaScript -->
    <script>
    let tasksPanelOpen = false;
    let tasksPollingInterval = null;

    function toggleTasksPanel() {
        tasksPanelOpen = !tasksPanelOpen;
        document.getElementById('tasksPanel').classList.toggle('active', tasksPanelOpen);
    }

    async function fetchTasks() {
        try {
            const response = await fetch('/api/v1/tasks?active_only=false');
            const tasks = await response.json();
            updateTasksWidget(tasks);
        } catch (e) {
            console.error('Failed to fetch tasks:', e);
        }
    }

    function updateTasksWidget(tasks) {
        const widget = document.getElementById('tasksWidget');
        const labelEl = document.getElementById('tasksLabel');
        const listEl = document.getElementById('tasksList');

        // Count active tasks
        const activeTasks = tasks.filter(t => t.status === 'pending' || t.status === 'running');
        const recentTasks = tasks.slice(0, 10);

        // Update label based on active task count
        const indicator = widget.querySelector('.tasks-indicator');
        if (activeTasks.length > 0) {
            labelEl.textContent = activeTasks.length + ' task(s) running';
            indicator.classList.add('active');
        } else {
            labelEl.textContent = 'No background tasks';
            indicator.classList.remove('active');
        }

        // Update tasks list
        listEl.innerHTML = recentTasks.map(task => {
            let statusClass = 'task-pending';
            let statusIcon = '◷';
            if (task.status === 'running') {
                statusClass = 'task-running';
                statusIcon = '↻';
            } else if (task.status === 'completed') {
                statusClass = 'task-completed';
                statusIcon = '✓';
            } else if (task.status === 'failed') {
                statusClass = 'task-failed';
                statusIcon = '✗';
            }

            return `
                <div class="task-item ${statusClass}">
                    <span class="task-icon">${statusIcon}</span>
                    <div class="task-info">
                        <div class="task-desc">${escapeHtml(task.description)}</div>
                        <div class="task-status">${escapeHtml(task.message || task.status)}</div>
                        ${task.status === 'running' ? `<div class="task-progress"><div class="task-progress-bar" style="width: ${task.progress}%"></div></div>` : ''}
                    </div>
                </div>
            `;
        }).join('') || '<div class="tasks-empty">No recent tasks</div>';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Start polling for tasks
    function startTasksPolling() {
        fetchTasks();
        tasksPollingInterval = setInterval(fetchTasks, 2000);
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', startTasksPolling);

    // Close panel when clicking outside
    document.addEventListener('click', (e) => {
        const widget = document.getElementById('tasksWidget');
        if (tasksPanelOpen && !widget.contains(e.target)) {
            tasksPanelOpen = false;
            document.getElementById('tasksPanel').classList.remove('active');
        }
    });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
