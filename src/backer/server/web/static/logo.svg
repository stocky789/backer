<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background shield shape -->
  <path d="M32 4L8 14v18c0 14.4 10.4 27.2 24 30 13.6-2.8 24-15.6 24-30V14L32 4z"
        fill="#1a2332" stroke="#58a6ff" stroke-width="2"/>

  <!-- Inner shield highlight -->
  <path d="M32 10L14 18v12c0 10.8 7.8 20.4 18 22.5 10.2-2.1 18-11.7 18-22.5V18L32 10z"
        fill="#0d1117"/>

  <!-- Stylized "B" made of stacked blocks (representing backup layers) -->
  <g fill="#58a6ff">
    <!-- Top block -->
    <rect x="22" y="18" width="16" height="6" rx="1"/>
    <!-- Middle block -->
    <rect x="22" y="27" width="20" height="6" rx="1"/>
    <!-- Bottom block -->
    <rect x="22" y="36" width="18" height="6" rx="1"/>
    <!-- Vertical bar -->
    <rect x="22" y="18" width="5" height="24" rx="1"/>
  </g>

  <!-- Small checkmark in corner -->
  <circle cx="44" cy="44" r="8" fill="#3fb950"/>
  <path d="M40 44l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
