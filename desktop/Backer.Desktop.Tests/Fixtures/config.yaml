agent_id: 1a2b3c4d
server:
  server_url: http://localhost:8420
  client_id: agent-1
  client_secret_ref: backer/agent/agent-1/secret
  heartbeat_interval: 60
repositories:
  9f8e7d6c5b4a:
    id: 9f8e7d6c5b4a
    name: nas
    type: smb
    server: 192.168.1.10
    share: backups
    username: matt
    scope: machine
    passphrase_ref: backer/repo/9f8e7d6c5b4a/passphrase
    storage_password_ref: backer/repo/9f8e7d6c5b4a/storage
    repository_options: {}
  0011223344ff:
    id: 0011223344ff
    name: usb
    type: local
    path: /mnt/usb/backer
jobs:
  Daily Docs:
    repository: 9f8e7d6c5b4a
    source:
      path: /home/matt/docs
      excludes:
        - "*.tmp"
        - node_modules
    schedule:
      cron: "0 2 * * *"
    retention:
      keep_last: 7
      keep_daily: 30
