[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backer"
version = "0.6.7"
description = "Unified backup orchestration - consolidating rsync, rclone, restic and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Backer Contributors" }
]
keywords = ["backup", "rsync", "rclone", "restic", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "croniter>=2.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
    "jinja2>=3.0",
    "python-multipart>=0.0.6",
    "cryptography>=41.0",
    "pywinrm[credssp]>=0.4.3",
]
client = [
    "httpx>=0.24",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10.0; sys_platform == 'win32'",
]
all = [
    "backer[server,client]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx>=0.24",
]

[project.scripts]
backer = "backer.cli:main"
backer-server = "backer.server.daemon:run_server"

[project.urls]
Homepage = "https://github.com/stocky789/backer"
Repository = "https://github.com/stocky789/backer"

[tool.hatch.build.targets.wheel]
packages = ["src/backer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["backer"]

[tool.mypy]
python_version = "3.10"
strict = true
