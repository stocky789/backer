name: Branch Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-info:
    name: Read Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read package version
        id: version
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          branch = os.environ.get("GITHUB_BASE_REF") or os.environ["GITHUB_REF_NAME"]
          if branch == "main":
              tag, title, prerelease = "release-main", f"Backer {version}", "false"
          elif branch == "dev":
              tag, title, prerelease = "release-dev", f"Backer {version} dev ({os.environ['GITHUB_SHA'][:7]})", "true"
          else:
              raise SystemExit(f"Branch must be main or dev, got {branch!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
              output.write(f"title={title}\n")
              output.write(f"version={version}\n")
              output.write(f"prerelease={prerelease}\n")

  python-ci:
    name: Ruff, Compile, Pytest
    runs-on: ubuntu-latest
    needs:
      - release-info

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check changelog
        run: python scripts/check_changelog.py

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Test
        run: python -m pytest -q

  python-package:
    name: Build Python Distribution
    runs-on: ubuntu-latest
    needs:
      - release-info
      - python-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install -e ".[dev]"

      - name: Build wheel and source archive
        run: python -m build

      - name: Upload Python release files
        uses: actions/upload-artifact@v3
        with:
          name: python-release-files
          path: dist/*
          if-no-files-found: error

  docker-build:
    name: Build Image And Validate Compose
    runs-on: ubuntu-latest
    needs:
      - release-info

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t backer:${{ needs.release-info.outputs.version }} .

      - name: Validate Docker Compose file
        run: docker compose -f docker-compose.yml config --quiet

  android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    needs:
      - release-info

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage Android release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release-assets
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" "../release-assets/backer-android.apk"

      - name: Upload Android release file
        uses: actions/upload-artifact@v3
        with:
          name: android-release-files
          path: release-assets/*
          if-no-files-found: error

  windows-agent-package:
    name: Build Windows Agent Package
    runs-on: windows-latest
    needs:
      - release-info

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and PyInstaller
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Build portable Windows agent
        run: python scripts/build_agent.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          iscc installer\backer-agent.iss

      - name: Stage Windows release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist\backer-agent-setup.exe release-assets\backer-agent-setup.exe
          $zip = Get-ChildItem dist\backer-agent-*-windows-amd64.zip | Select-Object -First 1
          if (-not $zip) { throw "Portable Windows zip was not created" }
          Copy-Item $zip.FullName release-assets\backer-agent-windows-portable.zip

      - name: Upload Windows release files
        uses: actions/upload-artifact@v3
        with:
          name: windows-release-files
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish Gitea Release
    runs-on: ubuntu-latest
    permissions:
      code: write
      contents: read
      releases: write
    needs:
      - release-info
      - python-ci
      - python-package
      - docker-build
      - android-release
      - windows-agent-package
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Check required jobs
        shell: bash
        env:
          ANDROID_RELEASE_RESULT: ${{ needs.android-release.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          PYTHON_CI_RESULT: ${{ needs.python-ci.result }}
          PYTHON_PACKAGE_RESULT: ${{ needs.python-package.result }}
          WINDOWS_AGENT_PACKAGE_RESULT: ${{ needs.windows-agent-package.result }}
        run: |
          set -euo pipefail
          for job in PYTHON_CI_RESULT PYTHON_PACKAGE_RESULT DOCKER_BUILD_RESULT ANDROID_RELEASE_RESULT; do
            result="${!job}"
            if [ "$result" != "success" ]; then
              echo "$job finished with $result"
              exit 1
            fi
          done
          if [ "$WINDOWS_AGENT_PACKAGE_RESULT" != "success" ]; then
            echo "WINDOWS_AGENT_PACKAGE_RESULT finished with $WINDOWS_AGENT_PACKAGE_RESULT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@v3
        with:
          path: release-assets

      - name: Move release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "gitea-actions"
          git config user.email "actions@git.stockhome.com.au"
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force

      - name: Publish release
        env:
          GITEA_BASE_URL: ${{ github.server_url }}
          GITEA_COMMIT: ${{ github.sha }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
          RELEASE_TITLE: ${{ needs.release-info.outputs.title }}
          RELEASE_PRERELEASE: ${{ needs.release-info.outputs.prerelease }}
        run: |
          notes="$(awk '/^## [0-9]/{n++} n==1' CHANGELOG.md)"
          body="$(printf '%s\nBuilt from %s.\n' "$notes" "$GITEA_COMMIT")"
          prerelease=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then prerelease=(--prerelease); fi
          python scripts/gitea_release.py \
            --asset-dir release-assets \
            --body "$body" \
            --name "${RELEASE_TITLE}" \
            --prune \
            --tag "${RELEASE_TAG}" \
            --target "${GITEA_COMMIT}" \
            "${prerelease[@]}"
