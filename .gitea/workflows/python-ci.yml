name: Python CI

on: workflow_dispatch

jobs:
  python-ci:
    name: Ruff, Compile, Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Test
        run: python -m pytest -q

  desktop-client:
    name: Desktop Client Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build desktop client
        run: dotnet build desktop/Backer.Desktop.sln -c Release

      - name: Test desktop client
        run: dotnet test desktop/Backer.Desktop.sln -c Release --no-build
