name: Docker Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Image And Validate Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t backer:ci .

      - name: Validate Docker Compose file
        run: docker compose -f docker-compose.yml config --quiet
