name: Release Validation

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release candidate tag to validate, for example v0.7.2
        required: true
      build_android_release:
        description: Build Android release APK
        required: true
        default: "true"
      build_windows_agent:
        description: Build Windows agent package when a windows-latest runner is available
        required: true
        default: "false"

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Test
        run: python -m pytest -q

  protocol-contract:
    name: Protocol Contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install verified backup tools
        run: backer setup --quiet

      - name: Run protocol release gates
        run: python -m pytest -q tests/test_protocol_contract.py tests/test_tools.py

  desktop-client:
    name: Desktop Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build desktop client
        run: dotnet build desktop/Backer.Desktop.sln -c Release

      - name: Test desktop client
        run: dotnet test desktop/Backer.Desktop.sln -c Release --no-build

  s3-contract:
    name: Kopia S3 Contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start pinned MinIO container
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --name backer-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=backer-access \
            -e MINIO_ROOT_PASSWORD=backer-secret-key \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          exit 1

      - name: Start pinned MinIO service
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $release = 'RELEASE.2025-09-07T16-13-09Z'
          $base = "https://dl.min.io/server/minio/release/windows-amd64/minio.$release"
          $checksumUrl = 'https://dl.min.io/server/minio/release/windows-amd64/minio.RELEASE.2025-09-07T16-13-09Z.sha256sum'
          Invoke-WebRequest -Uri $base -OutFile minio.exe
          Invoke-WebRequest -Uri $checksumUrl -OutFile minio.sha256sum
          $expected = ([regex]::Match((Get-Content minio.sha256sum -Raw), '[a-fA-F0-9]{64}')).Value.ToLowerInvariant()
          $actual = (Get-FileHash minio.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if (!$expected -or $actual -ne $expected) { throw 'MinIO publisher checksum mismatch' }
          New-Item -ItemType Directory -Force C:\minio-data | Out-Null
          $env:MINIO_ROOT_USER = 'backer-access'
          $env:MINIO_ROOT_PASSWORD = 'backer-secret-key'
          Start-Process -FilePath "$PWD\minio.exe" -ArgumentList 'server', '--address', ':9000', 'C:\minio-data' -WindowStyle Hidden
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try { Invoke-WebRequest http://127.0.0.1:9000/minio/health/live -UseBasicParsing | Out-Null; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          throw 'MinIO did not become healthy'

      - name: Install package and verified backup tools
        run: |
          python -m pip install -e ".[dev]"
          backer setup --quiet

      - name: Run Kopia S3 end-to-end contract
        env:
          BACKER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          BACKER_TEST_S3_BUCKET: backer-test
          BACKER_TEST_S3_ACCESS_KEY: backer-access
          BACKER_TEST_S3_SECRET_KEY: backer-secret-key
        run: python -m pytest -q tests/test_s3.py::test_s3_minio_end_to_end

      - name: Run serverless S3 end-to-end contract
        env:
          BACKER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          BACKER_TEST_S3_BUCKET: backer-test
          BACKER_TEST_S3_ACCESS_KEY: backer-access
          BACKER_TEST_S3_SECRET_KEY: backer-secret-key
        run: python -m pytest -q tests/test_serverless_e2e.py -k s3

  serverless-local:
    name: Serverless Local (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and verified backup tools
        run: |
          python -m pip install -e ".[dev]"
          backer setup --quiet

      - name: Run local serverless end-to-end contract
        run: python -m pytest -q tests/test_serverless_e2e.py -k local

  serverless-smb-linux:
    name: Serverless SMB (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Start pinned Samba service
        run: |
          mkdir -p "$RUNNER_TEMP/backer-share"
          chmod 0777 "$RUNNER_TEMP/backer-share"
          docker run -d --name backer-samba --privileged -p 445:445 -v "$RUNNER_TEMP/backer-share:/share" dperson/samba@sha256:e1d2a7366690749a7be06f72bdbf6a5a7d15726fc84e4e4f41e967214516edfd -u "backer;backer-secret" -s "Backups;/share;yes;no;no;backer"
          for attempt in $(seq 1 30); do
            timeout 1 bash -c '</dev/tcp/127.0.0.1/445' && exit 0
            sleep 1
          done
          exit 1

      - name: Install package, backup tools, and CIFS client
        run: |
          sudo apt-get update
          sudo apt-get install -y cifs-utils
          python -m pip install -e ".[dev]"
          backer setup --quiet

      - name: Run SMB serverless end-to-end contract
        env:
          BACKER_TEST_SMB_SERVER: 127.0.0.1
          BACKER_TEST_SMB_SHARE: Backups
          BACKER_TEST_SMB_USERNAME: backer
          BACKER_TEST_SMB_PASSWORD: backer-secret
          BACKER_TEST_SMB_REPOSITORY_PATH: ${{ runner.temp }}/backer-share
        run: sudo -E python -m pytest -q tests/test_serverless_e2e.py -k smb_linux

  serverless-smb-windows:
    name: Serverless SMB (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Create isolated SMB share and users
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString 'BackerCi9!Smb' -AsPlainText -Force
          New-Item -ItemType Directory -Force C:\backer-share | Out-Null
          New-LocalUser -Name backer-ci -Password $password -PasswordNeverExpires | Out-Null
          New-LocalUser -Name backer-ci-other -Password $password -PasswordNeverExpires | Out-Null
          New-SmbShare -Name Backups -Path C:\backer-share -FullAccess 'backer-ci', 'backer-ci-other' | Out-Null
          icacls C:\backer-share /grant 'backer-ci:(OI)(CI)M' 'backer-ci-other:(OI)(CI)M' /t /c | Out-Null

      - name: Install package and verified backup tools
        run: |
          python -m pip install -e ".[dev]"
          backer setup --quiet

      - name: Run SMB serverless end-to-end contract
        env:
          BACKER_TEST_SMB_SERVER: localhost
          BACKER_TEST_SMB_SHARE: Backups
          BACKER_TEST_SMB_USERNAME: backer-ci
          BACKER_TEST_SMB_PASSWORD: BackerCi9!Smb
          BACKER_TEST_SMB_OTHER_USERNAME: backer-ci-other
          BACKER_TEST_SMB_REPOSITORY_PATH: C:\backer-share
        run: python -m pytest -q tests/test_serverless_e2e.py -k smb_windows

  verify-version:
    name: Verify Version Matches Tag
    runs-on: ubuntu-latest
    needs:
      - python-ci
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compare package version with tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: python
        run: |
          import ast
          import os
          import pathlib
          import re
          import tomllib

          def read_text(path):
              return pathlib.Path(path).read_text(encoding="utf-8")

          def find_required(pattern, text, source):
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"Could not find version in {source}")
              return match.group(1)

          def android_version_code(version):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not match:
                  raise SystemExit(f"Android versionCode requires x.y.z version, got {version!r}")
              major, minor, patch = (int(part) for part in match.groups())
              return major * 10000 + minor * 100 + patch

          tag = os.environ.get("RELEASE_TAG") or os.environ.get("GITHUB_REF_NAME")
          if not tag:
              raise SystemExit("No release tag was provided")
          expected = tag[1:] if tag.startswith("v") else tag

          pyproject = tomllib.loads(read_text("pyproject.toml"))
          package_version = pyproject["project"]["version"]

          version_file = pathlib.Path("src/backer/_version.py")
          module_version = None
          tree = ast.parse(read_text(version_file))
          for node in tree.body:
              if (
                  isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
                  and isinstance(node.value, ast.Constant)
              ):
                  module_version = str(node.value.value)
                  break

          if package_version != expected:
              raise SystemExit(f"pyproject.toml version {package_version!r} does not match tag {tag!r}")
          if module_version != expected:
              raise SystemExit(f"src/backer/_version.py version {module_version!r} does not match tag {tag!r}")

          installer_version = find_required(
              r'#define\s+MyAppVersion\s+"([^"]+)"',
              read_text("installer/backer-agent.iss"),
              "installer/backer-agent.iss",
          )
          if installer_version != expected:
              raise SystemExit(f"installer/backer-agent.iss version {installer_version!r} does not match tag {tag!r}")

          csproj_version = find_required(
              r"<Version>([^<]+)</Version>",
              read_text("desktop/Backer.Desktop/Backer.Desktop.csproj"),
              "desktop/Backer.Desktop/Backer.Desktop.csproj",
          )
          if csproj_version != expected:
              raise SystemExit(
                  f"desktop/Backer.Desktop/Backer.Desktop.csproj version {csproj_version!r} does not match tag {tag!r}"
              )

          android_gradle = read_text("android/app/build.gradle.kts")
          android_version = find_required(r'versionName\s*=\s*"([^"]+)"', android_gradle, "android/app/build.gradle.kts")
          if android_version != expected:
              raise SystemExit(f"Android versionName {android_version!r} does not match tag {tag!r}")

          android_code = int(find_required(r"versionCode\s*=\s*(\d+)", android_gradle, "android/app/build.gradle.kts"))
          expected_android_code = android_version_code(expected)
          if android_code != expected_android_code:
              raise SystemExit(
                  f"Android versionCode {android_code} does not match expected {expected_android_code} for {tag!r}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={expected}\n")
              output.write(f"tag={tag}\n")

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - verify-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Build Docker image
        run: docker build --pull -t backer:${{ needs.verify-version.outputs.version }} .

      - name: Validate Docker Compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Save Docker image artifact
        run: docker save backer:${{ needs.verify-version.outputs.version }} | gzip > backer-docker-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: backer-docker-image-${{ needs.verify-version.outputs.version }}
          path: backer-docker-image.tar.gz
          if-no-files-found: error

  android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    needs:
      - verify-version
    if: github.event_name == 'push' || inputs.build_android_release == 'true'

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v3
        with:
          name: backer-release-apk-${{ needs.verify-version.outputs.version }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows-agent-package:
    name: Build Windows Agent Package
    runs-on: windows-latest
    needs:
      - verify-version
    if: inputs.build_windows_agent == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and PyInstaller
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Windows agent package
        run: python scripts/build_agent.py

      - name: Upload Windows agent artifact
        uses: actions/upload-artifact@v3
        with:
          name: backer-windows-agent-${{ needs.verify-version.outputs.version }}
          path: dist/**
          if-no-files-found: error

  release-artifacts-ready:
    name: Release Artifacts Ready
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - python-ci
      - protocol-contract
      - desktop-client
      - s3-contract
      - serverless-local
      - serverless-smb-linux
      - serverless-smb-windows
      - docker-build
      - android-release
      - windows-agent-package
    if: always()

    steps:
      - name: Check release jobs
        shell: bash
        env:
          VERIFY_VERSION_RESULT: ${{ needs.verify-version.result }}
          PYTHON_CI_RESULT: ${{ needs.python-ci.result }}
          PROTOCOL_CONTRACT_RESULT: ${{ needs.protocol-contract.result }}
          DESKTOP_CLIENT_RESULT: ${{ needs.desktop-client.result }}
          S3_CONTRACT_RESULT: ${{ needs.s3-contract.result }}
          SERVERLESS_LOCAL_RESULT: ${{ needs.serverless-local.result }}
          SERVERLESS_SMB_LINUX_RESULT: ${{ needs.serverless-smb-linux.result }}
          SERVERLESS_SMB_WINDOWS_RESULT: ${{ needs.serverless-smb-windows.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          ANDROID_RELEASE_RESULT: ${{ needs.android-release.result }}
          WINDOWS_AGENT_PACKAGE_RESULT: ${{ needs.windows-agent-package.result }}
        run: |
          set -euo pipefail
          for job in VERIFY_VERSION_RESULT PYTHON_CI_RESULT PROTOCOL_CONTRACT_RESULT DESKTOP_CLIENT_RESULT S3_CONTRACT_RESULT SERVERLESS_LOCAL_RESULT SERVERLESS_SMB_LINUX_RESULT SERVERLESS_SMB_WINDOWS_RESULT DOCKER_BUILD_RESULT; do
            result="${!job}"
            if [ "$result" != "success" ]; then
              echo "$job finished with $result"
              exit 1
            fi
          done
          for optional_job in ANDROID_RELEASE_RESULT WINDOWS_AGENT_PACKAGE_RESULT; do
            result="${!optional_job}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "$optional_job finished with $result"
              exit 1
            fi
          done
