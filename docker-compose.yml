# Backer Server - Docker Compose
#
# Quick start:
#   sudo docker-compose up -d
#
# Web UI: http://localhost:8420
# Default login: admin / admin

services:
  backer:
    image: ghcr.io/stocky789/backer:latest
    container_name: backer
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - backer-data:/data
      # Optional: Mount backup destinations
      # - /mnt/backups:/mnt/backups
    environment:
      BACKER_DATA_DIR: /data
    # Required for SMB/NFS mounts inside container
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    labels:
      com.backer.description: "Unified backup orchestration server"
      com.backer.version: "latest"
    # Health check (Docker will monitor container health)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  backer-data:
    name: backer-data
    driver: local