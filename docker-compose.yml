# Backer Server
#
# Start: docker compose up -d
# Web UI: http://<your-ip>:8420
# On first start, open the web UI and complete the setup wizard.

services:
  backer:
    build: .
    image: backer:0.7.2
    container_name: backer
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - backer-data:/data
      # Optional: mount additional paths for LOCAL repositories
      # - /mnt/nas/backups:/data/backups
    environment:
      BACKER_DATA_DIR: /data
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  backer-data:
