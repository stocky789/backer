# Backer Server - Docker Compose
#
# Quick start:
#   sudo docker-compose up -d
#
# Web UI: http://localhost:8420
# Default login: admin / admin

services:
  backer:
    image: ghcr.io/stocky789/backer:latest
    container_name: backer
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - backer-data:/data
      # Optional: Mount backup destinations for Local Directory repositories
      # These paths can then be configured in the Backer UI as "Local Directory" repos
      # Examples:
      # - /mnt/nas/backups:/data/backups:delegated        # Mount host NAS to container
      # - ./backups:/data/backups:delegated               # Mount local folder (set delegated for performance)
      # - /path/to/external:/data/external:delegated      # Mount external drive
    environment:
      BACKER_DATA_DIR: /data
      # Public URL for reverse proxy support (Cloudflare, nginx, etc.)
      # Set this to your external domain when using a reverse proxy
      # Examples:
      # - http://localhost:8420 (default, no reverse proxy)
      # - https://backer.example.com (with reverse proxy)
      # - http://192.168.1.100:8420 (IP-based access)
      BACKER_PUBLIC_URL: http://localhost:8420
      # SSL/TLS verification for reverse proxies with self-signed certificates
      # Options: "true" (default), "false" (dev only), or path to CA bundle
      BACKER_SSL_VERIFY: "true"
      # JWT secret for token-based authentication (change in production!)
      # If not set, a temporary secret will be generated (tokens invalid after restart)
      # Generate with: openssl rand -base64 32
      # BACKER_JWT_SECRET: "change-me-in-production"
    # User/Group configuration for volume permissions
    # Set UID/GID to match your host user/group to avoid permission issues
    # Default: 1000:1000 (typical unprivileged user)
    # To use current user: user: "${UID:-1000}:${GID:-1000}"
    user: "${UID:-1000}:${GID:-1000}"
    # Required for SMB/NFS mounts inside container
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    labels:
      com.backer.description: "Unified backup orchestration server"
      com.backer.version: "latest"
    # Health check (Docker will monitor container health)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  backer-data:
    name: backer-data
    driver: local