# Backer Server
#
# Start: docker compose up -d
# Web UI: http://<your-ip>:8420
# Login: admin / admin

services:
  backer:
    image: ghcr.io/stocky789/backer:latest
    container_name: backer
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - backer-data:/data
      # Optional: mount additional paths for LOCAL repositories
      # - /mnt/nas/backups:/data/backups
    environment:
      BACKER_DATA_DIR: /data
      # Change this to your server's IP or public domain name for agents to connect - local repos will not work without this set
      BACKER_PUBLIC_URL: http://localhost:8420
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  backer-data:
