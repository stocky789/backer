name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false

jobs:
  # Run tests on both platforms (always runs)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,client]"

      - name: Run linting
        run: ruff check src/ --exit-non-zero-on-fix

      - name: Run tests
        run: pytest tests/ -v --tb=short

      # Docker build validation (Linux only)
      - name: Set up Docker Buildx
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker build
        if: matrix.os == 'ubuntu-latest'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: test-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build Windows agent installer (only on release)
  build-windows-agent:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[client]"
          pip install pyinstaller

      - name: Verify PyInstaller spec exists
        run: |
          if (!(Test-Path "backer-agent.spec")) {
            Write-Error "backer-agent.spec not found!"
            exit 1
          }
        shell: pwsh

      - name: Download rclone
        run: |
          $rcloneVersion = "1.68.2"
          $url = "https://downloads.rclone.org/v$rcloneVersion/rclone-v$rcloneVersion-windows-amd64.zip"
          New-Item -ItemType Directory -Force -Path dist\tools
          Invoke-WebRequest -Uri $url -OutFile rclone.zip
          Expand-Archive -Path rclone.zip -DestinationPath temp
          Move-Item temp\rclone-v$rcloneVersion-windows-amd64\rclone.exe dist\tools\rclone.exe
        shell: pwsh

      - name: Download restic
        run: |
          $resticVersion = "0.17.3"
          $url = "https://github.com/restic/restic/releases/download/v$resticVersion/restic_${resticVersion}_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile restic.zip
          Expand-Archive -Path restic.zip -DestinationPath temp-restic
          # Restic zip contains versioned exe (restic_X.Y.Z_windows_amd64.exe)
          Get-ChildItem temp-restic -Filter "restic*.exe" | Move-Item -Destination dist\tools\restic.exe
        shell: pwsh

      - name: Build GUI with PyInstaller
        run: |
          pyinstaller --clean backer-agent.spec
          # PyInstaller outputs to dist/backer-agent.exe

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            # Extract version from pyproject.toml
            $content = Get-Content pyproject.toml -Raw
            if ($content -match 'version\s*=\s*"([^"]+)"') {
              $version = $matches[1]
            } else {
              $version = "0.0.0"
            }
          }
          $version = $version -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Installer
        run: |
          # Update version in installer script
          $version = "${{ steps.version.outputs.version }}"
          (Get-Content installer\\backer-agent.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer\\backer-agent.iss

          # Build installer
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer\\backer-agent.iss
        shell: pwsh

      - name: Create ZIP package (fallback)
        run: |
          mkdir dist\backer-agent-windows
          mkdir dist\backer-agent-windows\tools
          copy dist\backer-agent.exe dist\backer-agent-windows\
          copy dist\tools\rclone.exe dist\backer-agent-windows\tools\
          copy dist\tools\restic.exe dist\backer-agent-windows\tools\
          echo "Backer Agent for Windows - Run backer-agent.exe and enter your server address" > dist\backer-agent-windows\README.txt
          Compress-Archive -Path dist\backer-agent-windows\* -DestinationPath dist\backer-agent-windows-portable.zip
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: backer-agent-installer
          path: dist/backer-agent-setup.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: backer-agent-portable
          path: dist/backer-agent-windows-portable.zip

  # Build and push Docker image (only on release)
  build-docker:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from pyproject.toml
            VERSION=$(grep -E '^version\s*=' pyproject.toml | sed 's/version\s*=\s*"\([^"]*\)"/\1/')
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build Python package (only on release)
  build-python:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  # Build Android APK (only on release)
  build-android:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep -E '^version\s*=' pyproject.toml | sed 's/version\s*=\s*"\([^"]*\)"/\1/')
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Convert semver to Android version code (major*10000 + minor*100 + patch)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3 | cut -d- -f1)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Update version in build.gradle.kts
        run: |
          cd android/app
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ steps.version.outputs.version_code }}/" build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ steps.version.outputs.version }}\"/" build.gradle.kts

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/backer-android-${{ steps.version.outputs.version }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backer-android
          path: android/app/build/outputs/apk/debug/backer-android-*.apk

  # Create GitHub Release (only on release)
  release:
    needs: [build-windows-agent, build-python, build-docker, build-android]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: backer-agent-installer
          path: release/

      - name: Download Windows portable
        uses: actions/download-artifact@v4
        with:
          name: backer-agent-portable
          path: release/

      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release/

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: backer-android
          path: release/

      - name: Get release metadata
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          else
            # Extract version from pyproject.toml
            VERSION=$(grep -E '^version\s*=' pyproject.toml | sed 's/version\s*=\s*"\([^"]*\)"/\1/')
          fi
          TAG="v$VERSION"
          TITLE="Backer v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            release/backer-agent-setup.exe
            release/backer-agent-windows-portable.zip
            release/backer-android-*.apk
            release/*.whl
            release/*.tar.gz
          body: |
            ## ${{ steps.version.outputs.title }}

            ### Downloads

            | Platform | Download | Description |
            |----------|----------|-------------|
            | Docker | `ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}` | **Recommended** for server |
            | Windows Installer | `backer-agent-setup.exe` | **Recommended** for Windows agents |
            | Windows Portable | `backer-agent-windows-portable.zip` | No installation required |
            | Android | `backer-android-${{ steps.version.outputs.version }}.apk` | Android 8.0+ |
            | Linux/Python | `backer-*.whl` | pip install |

            ### Windows Agent Installation

            **Option 1: Installer (Recommended)**
            1. Download `backer-agent-setup.exe`
            2. Run the installer
            3. Enter your server address when the app opens
            4. Click Connect

            **Option 2: Portable**
            1. Download and extract `backer-agent-windows-portable.zip`
            2. Run `backer-agent.exe`
            3. Enter your server address
            4. Click Connect

            ### Android Agent Installation

            1. Download `backer-android-${{ steps.version.outputs.version }}.apk`
            2. Enable "Install from unknown sources" in Android settings if prompted
            3. Install the APK
            4. Open the app and enter your Backer server URL
            5. Tap "Test Connection" then "Register Agent"
            6. The device will appear in Backer web UI under Agents

            ### Server Installation (Linux)

            **Option 1: Docker (Recommended)**
            ```bash
            docker run -d --name backer \
              --restart unless-stopped \
              -p 8420:8420 \
              -v backer-data:/data \
              --cap-add SYS_ADMIN \
              --security-opt apparmor:unconfined \
              ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            **Option 2: Docker Compose**
            ```bash
            git clone https://github.com/${{ github.repository }}.git && cd backer
            docker compose up -d
            ```

            **Option 3: Direct Install**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```

            See the [README](https://github.com/${{ github.repository }}#readme) for full documentation.
