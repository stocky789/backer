name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true

jobs:
  # Build Windows agent installer
  build-windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[client]"
          pip install pyinstaller

      - name: Download rclone
        run: |
          $rcloneVersion = "1.68.2"
          $url = "https://downloads.rclone.org/v$rcloneVersion/rclone-v$rcloneVersion-windows-amd64.zip"
          New-Item -ItemType Directory -Force -Path dist\tools
          Invoke-WebRequest -Uri $url -OutFile rclone.zip
          Expand-Archive -Path rclone.zip -DestinationPath temp
          Move-Item temp\rclone-v$rcloneVersion-windows-amd64\rclone.exe dist\tools\rclone.exe
        shell: pwsh

      - name: Download restic
        run: |
          $resticVersion = "0.17.3"
          $url = "https://github.com/restic/restic/releases/download/v$resticVersion/restic_${resticVersion}_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile restic.zip
          Expand-Archive -Path restic.zip -DestinationPath temp-restic
          Move-Item temp-restic\restic_${resticVersion}_windows_amd64.exe dist\tools\restic.exe
        shell: pwsh

      - name: Build GUI with PyInstaller
        run: |
          pyinstaller --clean backer-agent.spec
          # PyInstaller outputs to dist/backer-agent.exe

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Build Installer
        run: |
          # Update version in installer script
          $version = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $version -replace '^v', ''
          (Get-Content installer\backer-agent.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer\backer-agent.iss

          # Build installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\backer-agent.iss
        shell: pwsh

      - name: Create ZIP package (fallback)
        run: |
          mkdir dist\backer-agent-windows
          mkdir dist\backer-agent-windows\tools
          copy dist\backer-agent.exe dist\backer-agent-windows\
          copy dist\tools\rclone.exe dist\backer-agent-windows\tools\
          copy dist\tools\restic.exe dist\backer-agent-windows\tools\
          echo "Backer Agent for Windows - Run backer-agent.exe and enter your server address" > dist\backer-agent-windows\README.txt
          Compress-Archive -Path dist\backer-agent-windows\* -DestinationPath dist\backer-agent-windows-portable.zip
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: backer-agent-installer
          path: dist/backer-agent-setup.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: backer-agent-portable
          path: dist/backer-agent-windows-portable.zip

  # Build Python package
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  # Create GitHub Release
  release:
    needs: [build-windows-agent, build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: backer-agent-installer
          path: release/

      - name: Download Windows portable
        uses: actions/download-artifact@v4
        with:
          name: backer-agent-portable
          path: release/

      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release/

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Backer v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release/backer-agent-setup.exe
            release/backer-agent-windows-portable.zip
            release/*.whl
            release/*.tar.gz
          body: |
            ## Backer v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Download | Description |
            |----------|----------|-------------|
            | Windows Installer | `backer-agent-setup.exe` | **Recommended** - Easy install wizard |
            | Windows Portable | `backer-agent-windows-portable.zip` | No installation required |
            | Linux/Python | `backer-*.whl` | pip install |

            ### Windows Agent Installation

            **Option 1: Installer (Recommended)**
            1. Download `backer-agent-setup.exe`
            2. Run the installer
            3. Enter your server address when the app opens
            4. Click Connect

            **Option 2: Portable**
            1. Download and extract `backer-agent-windows-portable.zip`
            2. Run `backer-agent.exe`
            3. Enter your server address
            4. Click Connect

            ### Server Installation (Linux)

            ```bash
            # One-line install
            curl -fsSL https://raw.githubusercontent.com/stocky789/backer/main/install.sh | sudo bash
            ```

            Or with Docker:
            ```bash
            git clone https://github.com/stocky789/backer.git && cd backer
            docker compose up -d
            ```

            See the [README](https://github.com/stocky789/backer#readme) for full documentation.
