name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true

jobs:
  # Build Windows agent executable
  build-windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[client]"
          pip install pyinstaller

      - name: Download rclone
        run: |
          $rcloneVersion = "1.65.0"
          $url = "https://downloads.rclone.org/v$rcloneVersion/rclone-v$rcloneVersion-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile rclone.zip
          Expand-Archive -Path rclone.zip -DestinationPath tools
          Move-Item tools/rclone-v$rcloneVersion-windows-amd64/rclone.exe tools/rclone.exe
        shell: pwsh

      - name: Download restic
        run: |
          $resticVersion = "0.16.2"
          $url = "https://github.com/restic/restic/releases/download/v$resticVersion/restic_${resticVersion}_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile restic.zip
          Expand-Archive -Path restic.zip -DestinationPath tools
        shell: pwsh

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean backer-agent.spec

      - name: Create package
        run: |
          mkdir dist\backer-agent-windows
          mkdir dist\backer-agent-windows\tools
          copy dist\backer-agent.exe dist\backer-agent-windows\
          copy tools\rclone.exe dist\backer-agent-windows\tools\
          copy tools\restic*.exe dist\backer-agent-windows\tools\restic.exe

          # Create README
          @"
          Backer Agent for Windows
          ========================

          Quick Start:
          1. Open Command Prompt as Administrator
          2. Register with your server:
             backer-agent.exe register --server http://your-server:8420

          3. Install as Windows service:
             backer-agent.exe install

          4. Or run manually:
             backer-agent.exe start

          For more info: https://github.com/stocky789/backer
          "@ | Out-File -FilePath dist\backer-agent-windows\README.txt
        shell: pwsh

      - name: Create ZIP
        run: |
          Compress-Archive -Path dist\backer-agent-windows\* -DestinationPath dist\backer-agent-windows-amd64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backer-agent-windows
          path: dist/backer-agent-windows-amd64.zip

  # Build Python package
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  # Create GitHub Release
  release:
    needs: [build-windows-agent, build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows agent
        uses: actions/download-artifact@v4
        with:
          name: backer-agent-windows
          path: release/

      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release/

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Backer v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release/backer-agent-windows-amd64.zip
            release/*.whl
            release/*.tar.gz
          body: |
            ## Backer v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Download |
            |----------|----------|
            | Windows Agent | `backer-agent-windows-amd64.zip` |
            | Python Package | `backer-*.whl` |

            ### Server Installation (Linux)

            ```bash
            pip install backer-${{ steps.version.outputs.version }}.tar.gz[server]
            backer server start
            ```

            ### Windows Agent Installation

            1. Download `backer-agent-windows-amd64.zip`
            2. Extract to a folder
            3. Open Command Prompt as Administrator
            4. Run: `backer-agent.exe register --server http://your-server:8420`
            5. Run: `backer-agent.exe install`

            See the [README](https://github.com/stocky789/backer#readme) for full documentation.
