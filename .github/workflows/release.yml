name: Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-info:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      shortsha: ${{ steps.info.outputs.shortsha }}
      tag: ${{ steps.info.outputs.tag }}
      title: ${{ steps.info.outputs.title }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      docker-tags: ${{ steps.info.outputs.docker-tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate version and changelog
        run: python scripts/check_changelog.py
      - name: Read release metadata
        id: info
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          shortsha="${GITHUB_SHA::7}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          case "$branch" in
            main) tag=release-main title="Backer $version" prerelease=false; docker_tags="$image:$version,$image:latest" ;;
            dev) tag=release-dev title="Backer $version dev ($shortsha)" prerelease=true; docker_tags="$image:dev,$image:dev-$shortsha" ;;
            *) echo "Unsupported branch: $branch" >&2; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "shortsha=$shortsha"
            echo "tag=$tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "docker-tags=$docker_tags"
          } >> "$GITHUB_OUTPUT"

  python-ci:
    name: Ruff, Compile, Pytest
    runs-on: ubuntu-latest
    needs: release-info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q

  python-package:
    name: Build Python Distribution
    runs-on: ubuntu-latest
    needs: [release-info, python-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and source archive
        run: python -m build
      - name: Upload Python release files
        uses: actions/upload-artifact@v4
        with:
          name: python-release-files
          path: dist/*
          if-no-files-found: error

  docker-build:
    name: Build Image And Validate Compose
    runs-on: ubuntu-latest
    needs: release-info
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --pull -t backer:${{ needs.release-info.outputs.version }} .
      - name: Validate Docker Compose file
        run: docker compose -f docker-compose.yml config --quiet

  android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    needs: release-info
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Stage Android release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release-assets
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" ../release-assets/backer-android.apk
      - name: Upload Android release file
        uses: actions/upload-artifact@v4
        with:
          name: android-release-files
          path: release-assets/*
          if-no-files-found: error

  windows-agent-package:
    name: Build Windows Agent Package
    runs-on: windows-latest
    needs: release-info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and PyInstaller
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Build portable Windows agent
        run: python scripts/build_agent.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: powershell
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          iscc installer\backer-agent.iss
      - name: Stage Windows release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist\backer-agent-setup.exe release-assets\backer-agent-setup.exe
          $zip = Get-ChildItem dist\backer-agent-*-windows-amd64.zip | Select-Object -First 1
          if (-not $zip) { throw "Portable Windows zip was not created" }
          Copy-Item $zip.FullName release-assets\backer-agent-windows-portable.zip
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-files
          path: release-assets/*
          if-no-files-found: error

  docker-publish:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    needs: [release-info, docker-build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ needs.release-info.outputs.docker-tags }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release-info, python-ci, python-package, docker-build, android-release, windows-agent-package, docker-publish]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Move rolling tag
        env:
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in release-main|release-dev) ;; *) exit 1;; esac
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
      - name: Create or update release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.release-info.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
          RELEASE_TITLE: ${{ needs.release-info.outputs.title }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in release-main|release-dev) ;; *) exit 1;; esac
          notes="$(awk '/^## [0-9]/{n++} n==1' CHANGELOG.md)"
          printf '%s\n\nBuild SHA: `%s`\n' "$notes" "$GITHUB_SHA" > release-notes.md
          latest=true
          [ "$RELEASE_PRERELEASE" = true ] && latest=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease="$RELEASE_PRERELEASE" --latest="$latest"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease="$RELEASE_PRERELEASE" --latest="$latest"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          current_assets="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          while IFS= read -r asset; do
            [ -z "$asset" ] || grep -Fxq "$asset" <<< "$current_assets" || gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
