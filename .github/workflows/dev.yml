name: Dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Run linting and tests on both platforms
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,client]"

      - name: Run linting
        run: ruff check src/ --exit-non-zero-on-fix

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # Test Windows agent build (verify it compiles, but don't create release)
  build-windows-agent:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[client]"
          pip install pyinstaller

      - name: Verify PyInstaller spec exists
        run: |
          if (!(Test-Path "backer-agent.spec")) {
            Write-Error "backer-agent.spec not found!"
            exit 1
          }
        shell: pwsh

      - name: Build GUI with PyInstaller
        run: |
          pyinstaller --clean backer-agent.spec
          # Verify the exe was created
          if (!(Test-Path "dist/backer-agent.exe")) {
            Write-Error "Build failed - backer-agent.exe not found!"
            exit 1
          }
          Write-Host "Windows agent build successful!"
        shell: pwsh

  # Test Docker build (verify it builds, but don't push)
  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: backer:dev-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Test Python package build
  build-python:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          echo "Python package build successful!"
